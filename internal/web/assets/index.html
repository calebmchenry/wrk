<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wrk · Local workspace</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header><span class="wordmark">wrk</span><span class="badge">Local workspace</span></header>
    <h1>Your project, close at hand.</h1>
    <p id="project" class="path">Connecting to your project…</p>
    <section aria-live="polite" aria-atomic="true">
      <h2 id="status">Loading project</h2>
      <p id="summary"></p>
      <pre id="diagnostics" hidden></pre>
    </section>
    <button id="reload" type="button">Reload project</button>
    <p class="note">This preview checks your local project. Item browsing, live updates, and editing are coming next.</p>
  </main>
</body>
</html>
