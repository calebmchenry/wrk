name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal test)"
      - name: Tests (including real executable upgrades)
        run: go test -count=1 ./...
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Ticket burn runner (fake commands only)
        run: python3 -B -m unittest discover -s scripts -p 'test_ticket_burn.py' -v
      - name: Project validation
        run: go run ./cmd/wrk validate
      - name: Build and smoke-test development binary
        run: |
          go build -o ./bin/wrk ./cmd/wrk
          ./bin/wrk version --json

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --snapshot --clean
      - name: Verify archive and metadata contract
        run: python3 scripts/verify-release.py dist
